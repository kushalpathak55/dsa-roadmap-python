{% extends "base.html" %}

{% block title %}DSA Roadmap — Learn Data Structures & Algorithms{% endblock %}

{% block content %}
<div class="app">
  <header class="topbar-map">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span>DSA Roadmap</a>

    <div class="view-tabs" role="group" aria-label="Roadmap view">
      <button type="button" id="tab-map" class="active" aria-pressed="true">Map</button>
      <button type="button" id="tab-list" aria-pressed="false">List</button>
    </div>

    <div class="search-wrap">
      <input id="graph-search" type="text" placeholder="Filter topics&hellip; (try &quot;sort&quot; or &quot;graph&quot;)" autocomplete="off" aria-label="Filter topics">
    </div>

    <div class="legend" id="legend" role="group" aria-label="Filter by complexity">
      <button type="button" data-complexity="1"><span class="dot" style="background:var(--c-1)"></span>O(1)</button>
      <button type="button" data-complexity="logn"><span class="dot" style="background:var(--c-logn)"></span>O(log n)</button>
      <button type="button" data-complexity="n"><span class="dot" style="background:var(--c-n)"></span>O(n)</button>
      <button type="button" data-complexity="nlogn"><span class="dot" style="background:var(--c-nlogn)"></span>O(n log n)</button>
      <button type="button" data-complexity="n2"><span class="dot" style="background:var(--c-n2)"></span>O(n&sup2;)</button>
      <button type="button" data-complexity="exp"><span class="dot" style="background:var(--c-exp)"></span>Exponential</button>
    </div>

    <div class="progress-chip">
      <span class="progress-summary" id="progress-summary"></span>
      <div class="bar"><div class="progress-bar-fill"></div></div>
    </div>
    <div class="streak-badge" id="streak-badge" role="status">
      <span class="streak-badge-n">0</span>
      <span class="streak-badge-label">day streak</span>
    </div>
    <button type="button" id="achievements-trigger" class="achievements-trigger" aria-haspopup="dialog" aria-label="View achievements">
      <span aria-hidden="true">&#127942;</span>
    </button>
    <button type="button" id="onboarding-trigger" class="achievements-trigger" aria-haspopup="dialog" aria-label="Replay the tour">
      <span aria-hidden="true">?</span>
    </button>
  </header>

  <main id="main-content" tabindex="-1">
    <div id="graphWrap">
      <svg id="graphSvg" viewBox="0 0 1650 1300" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Roadmap prerequisite graph">
        <g id="viewport">
          <g id="edgesLayer"></g>
          <g id="nodesLayer"></g>
        </g>
      </svg>
    </div>

    <div id="listView">
      <div class="list-inner" id="listInner"></div>
    </div>

    <div class="zoom-controls">
      <button type="button" id="zoomIn" aria-label="Zoom in">+</button>
      <button type="button" id="zoomReset" aria-label="Reset zoom">&#10021;</button>
      <button type="button" id="zoomOut" aria-label="Zoom out">&minus;</button>
    </div>

    <div class="hint">Drag to pan &middot; scroll to zoom &middot; click a node for details</div>
  </main>
</div>

<div class="detail-panel" id="detailPanel">
  <div class="panel-top">
    <button type="button" class="panel-close" id="panelClose" aria-label="Close">&times;</button>
    <div class="panel-crumb" id="panelCrumb"></div>
    <span class="panel-tag" id="panelTag"></span>
    <h2 class="panel-title" id="panelTitle"></h2>
    <div class="panel-complexity" id="panelComplexity"><span class="dot"></span><span id="panelComplexityText"></span></div>
  </div>
  <div class="panel-body">
    <p id="panelBlurb"></p>
    <div class="prereq-box" id="prereqBox" hidden>
      <div class="label">Requires first</div>
      <div id="prereqList"></div>
    </div>
    <a class="panel-cta" id="panelCta" href="#">Start topic &rarr;</a>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', path='js/core/graph_map.js') }}"></script>
{% endblock %}
