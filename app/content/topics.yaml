# Single source of truth for the roadmap nav + routing.
# category order below = display order.
# status: built (has a live visualizer) | content_only (written, no algorithm to
#   run - e.g. a concept page) | coming_soon (placeholder, not written yet).
# algo_key must match a key in app/algorithms/registry.py ALGORITHMS when status: built.
# family selects which JS renderer the topic page mounts: array (Canvas bars) or list (DOM boxes).
# motion selects the decorative CSS analogy animation next to the ELI5 box (see partials/_motion.html).
# why is a one-sentence "why this topic, why now" used by Guided Mode - real
#   prerequisite reasoning grounded in what the topic builds on, not filler.

- slug: big-o
  category: Foundations
  title: "Big-O Notation"
  order: 1
  why: "Foundational vocabulary for time/space complexity, used to describe and compare every algorithm that follows - nothing else can be discussed precisely without it."
  requires: []
  status: content_only
  motion: growth
  markdown: big_o.md

- slug: linear-search
  category: Arrays & Searching
  title: "Linear Search"
  order: 1
  why: "The simplest possible search - establishes the baseline O(n) every smarter search gets compared against."
  requires: [big-o]
  status: built
  algo_key: linear_search
  family: array
  motion: magnify
  markdown: linear_search.md

- slug: binary-search
  category: Arrays & Searching
  title: "Binary Search"
  order: 2
  why: "Builds directly on Linear Search by adding one constraint (a sorted array) to drop from O(n) to O(log n) - the first lesson in trading a precondition for speed."
  requires: [big-o]
  status: built
  algo_key: binary_search
  family: array
  motion: magnify
  markdown: binary_search.md

- slug: two-pointers
  category: Array Techniques
  title: "Two Pointers"
  order: 1
  why: "Reuses the sorted-array intuition from Binary Search to solve a different shape of problem (pair-finding) in one pass instead of nested loops."
  requires: [linear-search, binary-search]
  status: built
  algo_key: two_pointer_sum
  family: array
  motion: magnify
  markdown: two_pointers.md

- slug: sliding-window
  category: Array Techniques
  title: "Sliding Window"
  order: 2
  why: "A natural extension of Two Pointers - a whole window slides across the array instead of two independent pointers, once that pointer intuition is comfortable."
  requires: [two-pointers]
  status: built
  algo_key: sliding_window_max_sum
  family: array
  motion: grid-fill
  markdown: sliding_window.md

- slug: bubble-sort
  category: Sorting
  title: "Bubble Sort"
  order: 1
  why: "The most literal possible sorting algorithm - repeatedly comparing neighbors - so it is the clearest place to first watch comparisons and swaps happen step by step."
  requires: [big-o]
  status: built
  algo_key: bubble_sort
  family: array
  motion: bubbles
  markdown: bubble_sort.md

- slug: selection-sort
  category: Sorting
  title: "Selection Sort"
  order: 2
  why: "Same O(n^2) cost as Bubble Sort but a different strategy (find-the-minimum) - useful for contrasting two ways to arrive at the same complexity class."
  requires: [bubble-sort]
  status: built
  algo_key: selection_sort
  family: array
  motion: bubbles
  markdown: selection_sort.md

- slug: insertion-sort
  category: Sorting
  title: "Insertion Sort"
  order: 3
  why: "The last of the three simple O(n^2) sorts, and the one whose real-world intuition (sorting a hand of cards) is most direct - a bridge before the faster, divide-and-conquer sorts."
  requires: [selection-sort]
  status: built
  algo_key: insertion_sort
  family: array
  motion: bubbles
  markdown: insertion_sort.md

- slug: merge-sort
  category: Sorting
  title: "Merge Sort"
  order: 4
  why: "The first divide-and-conquer algorithm in the roadmap - introduces recursion-driven splitting, a pattern reused constantly later (trees, DP)."
  requires: [insertion-sort]
  status: built
  algo_key: merge_sort
  family: array
  motion: split-merge
  markdown: merge_sort.md

- slug: quick-sort
  category: Sorting
  title: "Quick Sort"
  order: 5
  why: "Same divide-and-conquer shape as Merge Sort, but partitions in place - comparing the two directly is the clearest way to understand guaranteed vs. average-case performance."
  requires: [merge-sort]
  status: built
  algo_key: quick_sort
  family: array
  motion: split-merge
  markdown: quick_sort.md

- slug: heap-sort
  category: Sorting
  title: "Heap Sort"
  order: 6
  why: "Closes out sorting by introducing the heap data structure (covered properly later) through a use case you already understand, before it is used for anything new."
  requires: [quick-sort]
  status: built
  algo_key: heap_sort
  family: array
  motion: tree
  markdown: heap_sort.md

- slug: singly-linked-list
  category: Linked Lists
  title: "Singly Linked List"
  order: 1
  why: "The first data structure built from nodes and pointers rather than a flat array - a mental model every tree and graph later depends on."
  requires: [big-o]
  status: built
  algo_key: linked_list_demo
  family: list
  motion: chain
  markdown: singly_linked_list.md

- slug: stack
  category: Stacks & Queues
  title: "Stack"
  order: 1
  why: "The simplest possible constraint on top of a list (only touch one end) - small enough to fully internalize before Queue changes which end."
  requires: [singly-linked-list]
  status: built
  algo_key: stack_demo
  family: list
  motion: stack
  markdown: stack.md

- slug: queue
  category: Stacks & Queues
  title: "Queue"
  order: 2
  why: "The mirror image of Stack - same interface, opposite access rule - best learned right after Stack while the comparison is fresh."
  requires: [stack]
  status: built
  algo_key: queue_demo
  family: list
  motion: queue
  markdown: queue.md

- slug: hash-table
  category: Hashing
  title: "Hash Table (Chaining)"
  order: 1
  why: "Introduces near-O(1) lookup by trading the ordered structure of everything so far for raw speed - its collision handling reuses the linked-list chains from two topics ago."
  requires: [big-o]
  status: built
  algo_key: hash_table_demo
  family: hash
  motion: buckets
  markdown: hash_table.md

- slug: binary-search-tree
  category: Trees
  title: "Binary Search Tree"
  order: 1
  why: "The first branching (non-linear) data structure - keeps the sorted intuition from Binary Search, but in a shape that supports fast insertion and deletion too."
  requires: [binary-search]
  status: built
  algo_key: bst_ops
  family: tree
  motion: tree
  markdown: binary_search_tree.md

- slug: tree-traversals
  category: Trees
  title: "Tree Traversals"
  order: 2
  why: "Once a tree exists, the next question is how to visit every node in it - vocabulary every later tree and graph algorithm assumes you already have."
  requires: [binary-search-tree]
  status: built
  algo_key: tree_traversal_demo
  family: tree
  motion: tree
  markdown: tree_traversals.md

- slug: trie
  category: Trees
  title: "Trie (Prefix Tree)"
  order: 3
  why: "A specialized tree shaped around shared prefixes - lands best once general tree traversal is already second nature."
  requires: [tree-traversals]
  status: built
  algo_key: trie_demo
  family: tree
  motion: tree
  markdown: trie.md

- slug: union-find
  category: Trees
  title: "Union-Find (Disjoint Set)"
  order: 4
  why: "A different tree-shaped structure, optimized for are-these-two-things-connected - a question that shows up constantly once graphs are introduced next."
  requires: [tree-traversals]
  status: built
  algo_key: union_find_demo
  family: tree
  motion: network
  markdown: union_find.md

- slug: binary-heap
  category: Heaps
  title: "Binary Heap"
  order: 1
  why: "Revisits the tree shape from three topics ago, reorganized around one rule (parent always smaller/larger) that makes finding the min or max instant."
  requires: [heap-sort]
  status: built
  algo_key: binary_heap_demo
  family: tree
  motion: tree
  markdown: binary_heap.md

- slug: bfs
  category: Graphs
  title: "Breadth-First Search"
  order: 1
  why: "The first graph algorithm - and it reuses the Queue from Stacks & Queues directly, so that structure purpose finally clicks into place."
  requires: [tree-traversals]
  status: built
  algo_key: bfs_demo
  family: graph
  motion: network
  markdown: bfs.md

- slug: dfs
  category: Graphs
  title: "Depth-First Search"
  order: 2
  why: "The natural counterpart to BFS - same graph, opposite exploration strategy - best contrasted immediately after BFS while its behavior is fresh."
  requires: [bfs]
  status: built
  algo_key: dfs_demo
  family: graph
  motion: network
  markdown: dfs.md

- slug: dijkstra
  category: Graphs
  title: "Dijkstra's Algorithm"
  order: 3
  why: "Takes BFS's shortest-path idea and generalizes it to weighted edges, using the Binary Heap from the previous category to always expand the cheapest option first."
  requires: [dfs]
  status: built
  algo_key: dijkstra_demo
  family: graph
  motion: network
  markdown: dijkstra.md

- slug: topological-sort
  category: Graphs
  title: "Topological Sort"
  order: 4
  why: "Closes out graphs by reusing BFS traversal mechanics for a different question - not how far, but in what order."
  requires: [dfs, union-find]
  status: built
  algo_key: topological_sort_demo
  family: graph
  motion: network
  markdown: topological_sort.md

- slug: fibonacci-memo
  category: Dynamic Programming
  title: "Fibonacci (Memoization)"
  order: 1
  why: "The smallest example of the core DP idea - cache a subproblem answer instead of recomputing it - using a recurrence simple enough to trust before harder problems."
  requires: [tree-traversals]
  status: built
  algo_key: fibonacci_memo
  family: dp
  motion: grid-fill
  markdown: fibonacci_memo.md

- slug: knapsack
  category: Dynamic Programming
  title: "0/1 Knapsack"
  order: 2
  why: "The same caching idea as Fibonacci, but the subproblems now form a 2D grid instead of a line - the standard next step once 1D memoization feels natural."
  requires: [fibonacci-memo]
  status: built
  algo_key: knapsack
  family: dp
  motion: grid-fill
  markdown: knapsack.md

- slug: lcs
  category: Dynamic Programming
  title: "Longest Common Subsequence"
  order: 3
  why: "Another 2D DP grid like Knapsack, but the dependency between cells is diagonal instead of directly above - a deliberately different wiring to stress-test the same model."
  requires: [knapsack]
  status: built
  algo_key: lcs
  family: dp
  motion: grid-fill
  markdown: lcs.md

- slug: n-queens
  category: Backtracking
  title: "N-Queens"
  order: 1
  why: "Closes the roadmap with backtracking - explore, hit a dead end, undo, try again - a problem-solving pattern that does not fit neatly into anything covered so far."
  requires: [dfs]
  status: built
  algo_key: n_queens
  family: dp
  motion: grid-fill
  markdown: n_queens.md
