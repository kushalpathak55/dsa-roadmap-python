#   run - e.g. a concept page) | coming_soon (placeholder, not written yet).
# algo_key must match a key in app/algorithms/registry.py ALGORITHMS when status: built.
# family selects which JS renderer the topic page mounts: array (Canvas bars) or list (DOM boxes).
# motion selects the decorative CSS analogy animation next to the ELI5 box (see partials/_motion.html).

